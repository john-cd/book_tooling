# TODO Reviewed ??-??-2026

[package]
name = "parse_lib-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Keep this crate out of the main workspace: it needs nightly and is not built in CI.
[workspace]

[workspace.lints.clippy]
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
dbg_macro = "warn"
let_underscore_future = "warn"
unwrap_used = "warn"
todo = "warn"
unimplemented = "warn"
all = { level = "warn", priority = -1 }
[[bin]]
name = "round_trip"
path = "fuzz_targets/round_trip.rs"
test = false
doc = false
bench = false

[dependencies]
libfuzzer-sys = "0.4"
parse_lib = { path = ".." }
