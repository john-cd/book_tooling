# TODO Reviewed ??-??-2026

minimum_prek_version = "0.5.6"
default_install_hook_types = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "dprint-check",
    name = "dprint check",
    entry = "dprint check",
    language = "system",
    pass_filenames = false,
  },
  {
    id = "cargo-fmt",
    name = "cargo fmt --check",
    entry = "cargo +nightly-2026-10-22 fmt --all -- --check",
    language = "system",
    pass_filenames = false,
    types = ["rust"],
  },
]
