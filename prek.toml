minimum_prek_version = "0.5.6"

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-vcs-permalinks" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer", exclude = "^test_fixtures/markdown/crlf\\.md$" },
  { id = "fix-byte-order-marker" },
  { id = "mixed-line-ending", args = ["--fix=lf"], exclude = "^test_fixtures/markdown/crlf\\.md$" },
  { id = "trailing-whitespace", args = [
    "--markdown-linebreak-ext=md",
  ], exclude = "^test_fixtures/markdown/crlf\\.md$" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "dprint-check",
    name = "dprint check",
    entry = "dprint check",
    language = "system",
    pass_filenames = false,
  },
  {
    id = "cargo-fmt",
    name = "cargo fmt --check",
    entry = "just fmtcheck",
    language = "system",
    pass_filenames = false,
    types = ["rust"],
  },
]
