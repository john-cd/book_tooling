[package]
name = "book_tool"
version.workspace = true
authors.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false
rust-version.workspace = true
description = "A unified CLI for book tooling"

[[bin]]
name = "book_tool"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
directives = []
cli = [
    "directives",
    "dep:clap",
    "dep:httpdate",
    "dep:reqwest",
    "dep:serde_json",
    "dep:tokio",
    "dep:tracing-subscriber",
    "dep:url",
    "dep:icu_casemap",
]

[dependencies]
# Flexible concrete Error type built on std::error::Error
anyhow = { workspace = true }
# Markdown badge and link templates shared by book_tool and rust_rate.
book_templates = { workspace = true }
# A simple to use, efficient, and full-featured Command Line Argument Parser
clap = { workspace = true, features = ["derive"], optional = true }
# HTTP date parsing and formatting
httpdate = { workspace = true, optional = true }
# Full Unicode case folding for CommonMark reference labels.
icu_casemap = { workspace = true, optional = true }
# A collection of Rust-based tools for processing Markdown files, particularly for books and documentation projects.
parse_lib = { workspace = true }
# higher level HTTP client library
reqwest = { workspace = true, optional = true }
# A generic serialization/deserialization framework
serde = { workspace = true, features = ["derive"] }
# A JSON serialization file format
serde_json = { workspace = true, optional = true }
# A library for managing temporary files and directories.
tempfile = { workspace = true }
# An event-driven, non-blocking I/O platform for writing asynchronous I/O backed applications.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"], optional = true }
# A native Rust encoder and decoder of TOML-formatted files and streams. Provides implementations of the standard Serialize/Deserialize traits for...
toml = { workspace = true }
# Application-level tracing for Rust.
tracing = { workspace = true }
# Utilities for implementing and composing `tracing` subscribers.
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }
# URL library for Rust, based on the WHATWG URL Standard
url = { workspace = true, optional = true }
# Recursively walk a directory.
walkdir = { workspace = true }

[dev-dependencies]
# Provides statistical microbenchmarking, output formatting, and benchmark comparison tools.
divan = { workspace = true }

[[bench]]
name = "processing"
harness = false

[lints]
workspace = true
