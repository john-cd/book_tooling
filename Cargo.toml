# TODO Reviewed ??-??-2026
[workspace]
resolver = "3" # 3 is valid
members = [
    "book_tool",
    "parse_lib",
    "rust_rate"
]

# Default values for packages in the workspace
[workspace.package]
version = "0.1.3"
authors = ["John CD"]
edition = "2024"
rust-version = "1.86"
description = "A collection of Rust-based tools for processing Markdown files, particularly for books and documentation projects."
documentation = "https://docs.rs/book_tooling/"
homepage = "https://github.com/john-cd/book_tooling"
repository = "https://github.com/john-cd/book_tooling"
keywords = ["markdown", "book", "tooling", "cli", "rust"]
categories = [
    "command-line-utilities",
    "development-tools",
    "text-processing",
]
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
annotate-snippets = "0.12.16"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fmt2io = "1.0.0"
futures = "0.3.34"
futures-util = "0.3.34"
memmap2 = "0.9.12"
moka = { version = "0.12.16", features = ["future"] }
multimap = "0.10.1"
parse_lib = { path = "./parse_lib" }
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
walkdir = "2.5.0"
winnow = "1.0.4"

[workspace.lints.clippy]
# Don't Panic - prevent panics from unwraps and unsafe slicing or indexing
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"
# Optional - see post for caveats
# expect_used = "warn"
# arithmetic_side_effects = "warn"

# Don't Fail Silently - prevent dropped futures and swallowed errors
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# Don't Do Bad Async Stuff - prevent deadlocks and concurrency bugs
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
if_let_mutex = "warn"  # only relevant on editions before 2024
large_futures = "warn"

# Don't Do Unsafe Things with Memory
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

# Don't Do Potentially Incorrect Things with Numbers
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"
# Optional - these effectively force you to document numeric invariants
# cast_possible_wrap = "warn"
# cast_precision_loss = "warn"
# cast_possible_truncation = "warn"

# Don't Do Bad Things That are Easy to Avoid
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"

# Don't `allow` Your Way Around These Lints - every suppression must be
# a deliberate #[expect(..., reason = "…")] rather than a silent #[allow]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
