[workspace]
resolver = "3"
members = [ "core_lib", "process_directives", "link_checker", "inline_links", "parse_lib", "directive_lib", "rust_rate"]

# Default values for packages in the workspace
[workspace.package]
version = "0.1.2"
authors = ["John CD"]
edition = "2024"
rust-version = "1.86"
description = ""
documentation = "https://docs.rs/rust_howto/"
homepage = "https://john-cd.com/rust_howto/"
repository = "https://github.com/john-cd/rust_howto/wip/"
keywords = []
categories = []
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.99"
tracing = "0.1.41"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
clap = { version = "4.5.40", features = ["derive"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.7"
walkdir = "2.5.0"
tempfile = "3.21.0"
rayon = "1.10.0"
