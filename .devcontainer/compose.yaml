# Docker Compose reference: https://docs.docker.com/compose/
services:
  book-tooling:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        RUST_IMAGE_LABEL: ${RUST_IMAGE_LABEL:?Set RUST_IMAGE_LABEL in .devcontainer/.env}
        RUSTFMT_TOOLCHAIN: ${RUSTFMT_TOOLCHAIN:-}
        CARGO_NEXTEST_VERSION: ${CARGO_NEXTEST_VERSION:?Set CARGO_NEXTEST_VERSION in .devcontainer/.env}
        PREK_VERSION: ${PREK_VERSION:?Set PREK_VERSION in .devcontainer/.env}
        DPRINT_VERSION: ${DPRINT_VERSION:?Set DPRINT_VERSION in .devcontainer/.env}
        CARGO_DENY_VERSION: ${CARGO_DENY_VERSION:?Set CARGO_DENY_VERSION in .devcontainer/.env}
        JUST_VERSION: ${JUST_VERSION:?Set JUST_VERSION in .devcontainer/.env}
        SCCACHE_VERSION: ${SCCACHE_VERSION:?Set SCCACHE_VERSION in .devcontainer/.env}
    volumes:
      - type: bind
        source: ..
        target: /code
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - book_tooling_cache:/var/cache/book_tooling
    environment:
      RUSTFMT_TOOLCHAIN: ${RUSTFMT_TOOLCHAIN:-}
      BOOK_TOOLING_CACHE_HOME: /var/cache/book_tooling
      CODE_TARGET_ROOT: /var/cache/book_tooling/target
      CODE_BUILD_ROOT: /var/cache/book_tooling/build
      CODE_SCCACHE_ROOT: /var/cache/book_tooling/sccache
      CARGO_TARGET_DIR: /var/cache/book_tooling/target/book_tooling/main
      CARGO_BUILD_BUILD_DIR: /var/cache/book_tooling/build/book_tooling/main
      SCCACHE_DIR: /var/cache/book_tooling/sccache
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    working_dir: /code
    init: true
    command: sleep infinity

volumes:
  cargo_registry:
  cargo_git:
  book_tooling_cache:
