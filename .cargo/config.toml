[profile.ci]
inherits = "dev"      # Inherit from dev for fast compilation (`opt-level = 0`, `codegen-units = 256`).
opt-level = 1         # Use a little optimization so tests don't run too slowly.
debug = false         # Disable debug info to reduce binary size and link times.
lto = "off"           # Ensure LTO is off for faster linking.
# see: https://doc.rust-lang.org/cargo/reference/profiles.html
# see: https://nnethercote.github.io/perf-book/build-configuration.html

#[profile.ci.package."*"]  # Override profile for all packages.
#opt-level = 0

