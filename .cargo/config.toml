# TODO Reviewed ??-??-2026
# Build configuration: see CONFIGURATION.md at the repository root.
# The Just runner supplies absolute per-checkout paths. Direct Cargo uses these checkout-local
# names, which are linked to D:/target/<repo>/<slot> and D:/code_build/<repo>/<slot>.

[build]

# The justfile/Makefile.toml reads CODE_*_ROOT overrides (with Windows and XDG defaults) and exports per-checkout Cargo output paths; use its cargo command for these roots.
rustc-wrapper = "sccache"
incremental = false
target-dir = "target"
build-dir = "build"

[env]
SCCACHE_BASEDIRS = { value = ".", relative = true }

[env.SCCACHE_CACHE_SIZE]
value = "45G"
force = true

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

[target.aarch64-pc-windows-msvc]
linker = "rust-lld.exe"

[profile.dev]
lto = "off"
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 1
debug = 0

[profile.debug]
debug = 2

[profile.debug.package."*"]
opt-level = 1
debug = 0

[profile.ci]
inherits = "dev"

[profile.dev.package]
hashbrown = {opt-level = 3}
indexmap = {opt-level = 3}
memchr = {opt-level = 3}
num-traits = {opt-level = 3}
proc-macro2 = {opt-level = 3}
quote = {opt-level = 3}
rand = {opt-level = 3}
rayon = {opt-level = 3}
rayon-core = {opt-level = 3}
regex = {opt-level = 3}
regex-automata = {opt-level = 3}
regex-syntax = {opt-level = 3}
rustls = {opt-level = 3}
smallvec = {opt-level = 3}
syn = {opt-level = 3}

[profile.debug.package]
hashbrown = {opt-level = 3, debug = 0}
indexmap = {opt-level = 3, debug = 0}
memchr = {opt-level = 3, debug = 0}
num-traits = {opt-level = 3, debug = 0}
proc-macro2 = {opt-level = 3, debug = 0}
quote = {opt-level = 3, debug = 0}
rand = {opt-level = 3, debug = 0}
rayon = {opt-level = 3, debug = 0}
rayon-core = {opt-level = 3, debug = 0}
regex = {opt-level = 3, debug = 0}
regex-automata = {opt-level = 3, debug = 0}
regex-syntax = {opt-level = 3, debug = 0}
rustls = {opt-level = 3, debug = 0}
smallvec = {opt-level = 3, debug = 0}
syn = {opt-level = 3, debug = 0}

[profile.tools]
inherits = "dev"
opt-level = 2


# Cargo defaults reference (Cargo 1.100.0). Comments only.
#
# [build]
# target = <host>
# target-dir = "target"
# build-dir = <unset; defaults to target-dir>
# rustc-wrapper = <unset>
# incremental = <profile default>
#
# [env]
# <variable> = <unset>
#
# [net]
# retry = 3
# git-fetch-with-cli = false
# offline = false
#
# [term]
# quiet = false
# verbose = false
# color = "auto"
# hyperlinks = true
# unicode = true
# progress.when = "auto"
# progress.width = 80
# progress.term-integration = true
#
# [alias]
# b = "build"
# c = "check"
# d = "doc"
# t = "test"
# r = "run"
# rm = "remove"
#
# [profile.dev]
# opt-level = 0
# debug = true
# split-debuginfo = <platform default>
# strip = "none"
# debug-assertions = true
# overflow-checks = true
# lto = false
# panic = "unwind"
# incremental = true
# codegen-units = 256 when incremental is enabled; otherwise 16
# rpath = false
#
# [profile.dev.package."*"]
# opt-level = 0
#
# [profile.dev.build-override]
# opt-level = 0
# debug = false when possible
# codegen-units = 256
#
# [profile.debug]
# inherits = "dev"
#
# [profile.test]
# inherits = "dev"
#
# [profile.release]
# opt-level = 3
# debug = false
# split-debuginfo = <platform default>
# strip = "none"
# debug-assertions = false
# overflow-checks = false
# lto = false
# panic = "unwind"
# incremental = false
# codegen-units = 16
# rpath = false
#
# [profile.release.package."*"]
# opt-level = 3
#
# [profile.release.build-override]
# opt-level = 0
# debug = false when possible
# codegen-units = 256
#
# [profile.bench]
# inherits = "release"
