# TODO Reviewed ??-??-2026.

# Composite action: install the pinned Rust toolchains and restore the Cargo cache.
#
# Related Rust setup workflows are maintained in john-cd/rust_howto and
# john-cd/mdbook-utils. Keep their toolchain and cache behavior aligned where applicable.
# Works on Linux, macOS and Windows runners (uses `bash`, including Git Bash on Windows).
name: Set up Rust
description: Install the pinned stable and nightly (rustfmt) toolchains and cache Cargo artifacts.

inputs:
  toolchain:
    description: Optional stable toolchain override. Defaults to the channel in `rust-toolchain.toml`.
    default: ""
  nightly:
    description: Optional nightly toolchain override for `cargo fmt`; use `skip` to omit nightly rustfmt.
    default: ""
  components:
    description: Space-separated rustup components to add to the stable toolchain.
    default: "clippy"
  cache:
    description: Restore and save the Cargo cache (`Swatinem/rust-cache`).
    default: "true"
  cache-workspaces:
    description: Newline-separated Cargo workspaces to cache, as in `Swatinem/rust-cache`.
    default: "."
  cache-key:
    description: Extra cache key, to separate unrelated jobs that share the same workspace.
    default: ""
  save-cache:
    description: Whether to save the cache at the end of the job.
    default: "true"

outputs:
  rustfmt_toolchain:
    description: Validated nightly toolchain used for formatting, or empty when skipped.
    value: ${{ steps.install-toolchains.outputs.rustfmt_toolchain }}

runs:
  using: composite
  steps:
    - name: Install Rust toolchains
      id: install-toolchains
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        NIGHTLY_OVERRIDE: ${{ inputs.nightly }}
        COMPONENTS: ${{ inputs.components }}
      run: |
        set -euo pipefail
          if [ -z "$TOOLCHAIN" ]; then
            TOOLCHAIN="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          fi
          if [ -z "$TOOLCHAIN" ]; then
            echo "Stable Rust channel is missing from rust-toolchain.toml" >&2
            exit 1
          fi
        args=()
        for c in $COMPONENTS; do args+=(--component "$c"); done
        rustup toolchain install "$TOOLCHAIN" --profile minimal "${args[@]}"
        rustup default "$TOOLCHAIN"
        if [ "$NIGHTLY_OVERRIDE" = "skip" ]; then
          RUSTFMT_TOOLCHAIN=""
        elif [ -n "$NIGHTLY_OVERRIDE" ]; then
          RUSTFMT_TOOLCHAIN="$NIGHTLY_OVERRIDE"
        else
          RUSTFMT_TOOLCHAIN="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rustfmt-toolchain.toml)"
        fi
        if [[ -n "$RUSTFMT_TOOLCHAIN" && ! "$RUSTFMT_TOOLCHAIN" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
          echo "Invalid rustfmt toolchain name" >&2
          exit 1
        fi
        if [ -n "$RUSTFMT_TOOLCHAIN" ]; then
          rustup toolchain install "$RUSTFMT_TOOLCHAIN" --profile minimal --component rustfmt
        fi
        printf 'rustfmt_toolchain=%s\n' "$RUSTFMT_TOOLCHAIN" >> "$GITHUB_OUTPUT"
        rustup show
        cargo --version

    - name: Install compiler cache
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
      with:
        tool: sccache@0.19.0
    - name: Cache Cargo artifacts
      if: ${{ inputs.cache == 'true' }}
      # Swatinem/rust-cache v2.9.3
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        workspaces: ${{ inputs.cache-workspaces }}
        key: ${{ inputs.cache-key }}-config-v1-${{ github.workflow }}-${{ github.job }}-${{ runner.arch }}-${{
          hashFiles('**/Cargo.toml', '**/.cargo/config.toml', '**/rust-toolchain.toml', '**/Cargo.lock') }}
        save-if: ${{ inputs.save-cache == 'true' && github.event_name == 'push' && github.ref ==
          format('refs/heads/{0}', github.event.repository.default_branch) }}
        cache-directories: ${{ env.CARGO_BUILD_BUILD_DIR }}
