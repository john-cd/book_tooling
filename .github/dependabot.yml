# TODO Reviewed ??-??-2026

# Maintained dependency roots; immutable test fixtures are intentionally excluded.
version: 2
updates:
  - package-ecosystem: cargo
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
      day: monday
      time: 06:00
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    directories:
      - /
      - /parse_lib/fuzz
  - package-ecosystem: docker
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
      day: monday
      time: 06:00
      timezone: America/Los_Angeles
    directory: /.devcontainer
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: docker-compose
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
      day: monday
      time: 06:00
      timezone: America/Los_Angeles
    directory: /.devcontainer
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: devcontainers
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
      day: monday
      time: 06:00
      timezone: America/Los_Angeles
    directory: /
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
      day: monday
      time: 06:00
      timezone: America/Los_Angeles
    directories:
      - /
      - /.github/actions/setup-rust
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: rust-toolchain
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: 06:00
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
