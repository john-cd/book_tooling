# Workflow contract documentation (maintained with the implementation).
# Workflow contract: book_tooling / Fuzz.
# Purpose: Exercise parser or input-handling invariants with generated inputs.
# Execution: workflow_dispatch. Trigger branches/paths below are the authoritative input boundary.
# Manual operation: use the Actions tab or gh workflow run; input defaults below apply unless
# explicitly overridden.
# Manual controls: seconds: Fuzzing time budget in seconds..
# Run policy: newer runs replace obsolete validation in the same group.
# Access: workflow token permissions are {"contents": "read"}; job-level overrides below own any
# elevated access.
# Maintenance: keep full-SHA action references/tool pins coordinated with Dependabot and the
# repository configuration. See README.md in this directory for the job map and local validation.
# End workflow contract documentation.

# TODO Reviewed ??-??-2026.

## Manual libFuzzer run of the parse_lib `round_trip` target on a hosted Linux runner.
## Fuzzing is not a merge gate; run it on demand and record the result on the tracking issue.
name: Fuzz

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing time budget in seconds.
        default: "600"
        type: string

permissions:
  contents: read

# Serialize side effects; superseded validation may stop before spending more runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job fuzz: Exercise parser or input-handling invariants with generated inputs.
  # Fuzzing is a bounded deeper check; ordinary deterministic tests remain the fast regression
  # signal.
  fuzz:
    name: round_trip (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
      CARGO_INCREMENTAL: "0"
      FUZZ_SECONDS: ${{ inputs.seconds }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Install the compiler/components required by this lane. Keep the stable, minimum-version and
      # formatter toolchains distinct where their contracts differ.
      - name: Set up Rust
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      # Install the tool versions consumed by the following checks. Prefer the existing prebuilt
      # installer path to recompiling development tools on every fresh runner.
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32
        with:
          tool: cargo-fuzz@0.13.2
      - name: Fuzz round_trip
        shell: bash
        env:
          NIGHTLY: ${{ steps.rust.outputs.rustfmt_toolchain }}
        run: |
          set -euo pipefail
          [[ "$FUZZ_SECONDS" =~ ^[0-9]+$ ]] || { echo "seconds must be an integer" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/corpus"
          cp test_fixtures/markdown/* "$RUNNER_TEMP/corpus/" 2>/dev/null || true
          cargo "+$NIGHTLY" fuzz run --target x86_64-unknown-linux-gnu --fuzz-dir parse_lib/fuzz round_trip "$RUNNER_TEMP/corpus" \
            -- -max_total_time="$FUZZ_SECONDS" -print_final_stats=1 2>&1 | tee "$RUNNER_TEMP/fuzz.log"
          {
            echo "### round_trip fuzz result (${FUZZ_SECONDS}s, $GITHUB_SHA)"
            echo '```'
            tail -n 25 "$RUNNER_TEMP/fuzz.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Transfer this job output to the next consumer or retain diagnostics. Uploading an artifact
      # alone does not execute the deployment job.
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-artifacts
          path: parse_lib/fuzz/artifacts
          if-no-files-found: ignore
