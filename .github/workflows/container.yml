# Workflow contract documentation (maintained with the implementation).
# Workflow contract: book_tooling / Container.
# Purpose: Compile, lint or test the Rust source for the scope selected by the commands below.
# Execution: workflow_dispatch. Trigger branches/paths below are the authoritative input boundary.
# Manual operation: use the Actions tab or gh workflow run; input defaults below apply unless
# explicitly overridden.
# Run policy: newer runs replace obsolete validation in the same group.
# Access: workflow token permissions are {"contents": "read"}; job-level overrides below own any
# elevated access.
# Maintenance: keep full-SHA action references/tool pins coordinated with Dependabot and the
# repository configuration. See README.md in this directory for the job map and local validation.
# End workflow contract documentation.

# TODO Reviewed ??-??-2026.

## Manual check that the development container image builds and contains the pinned tools.
name: Container

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize side effects; superseded validation may stop before spending more runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job build: Compile, lint or test the Rust source for the scope selected by the commands below.
  # Keep compiler/profile/feature selections aligned so adjacent commands reuse outputs; retain real
  # binary generation, doctests and distinct minimum-version checks.
  build:
    name: Development image (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .devcontainer/.env \
            -f .devcontainer/compose.yaml \
            -f .devcontainer/compose.ci.yaml build
      # Run compiled test binaries with the configured Nextest profile. Nextest does not run Rust
      # doctests; retain the separate cargo test --doc step where present.
      - name: Check pinned tools
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .devcontainer/.env \
            -f .devcontainer/compose.yaml \
            -f .devcontainer/compose.ci.yaml \
            run --rm --no-deps book-tooling \
            bash -c 'rustc --version && cargo --version && cargo nextest --version && sccache --version && just --version && dprint --version && prek --version && cargo deny --version'
