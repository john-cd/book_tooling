## Continuous integration: runs the reusable Rust CI on Linux, macOS and Windows.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  ## Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: $/.github/workflows/rust-ci.yml
env:
  CODE_TARGET_ROOT: ${{ github.workspace }}/.ci/target
  CODE_BUILD_ROOT: ${{ github.workspace }}/.ci/build
  CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/book_tooling/main
  CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/book_tooling/main
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/book_tooling/main
  CARGO_INCREMENTAL: '0'
