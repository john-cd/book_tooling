# Workflow contract documentation (maintained with the implementation).
# Workflow contract: book_tooling / CI.
# Purpose: Classify changed inputs and export decisions to downstream jobs; Delegate validation to
# ./.github/workflows/rust-ci.yml; Build or validate the maintained documentation and generated
# output.
# Execution: push, pull_request, workflow_dispatch. Trigger branches/paths below are the
# authoritative input boundary.
# Manual operation: use the Actions tab or gh workflow run; input defaults below apply unless
# explicitly overridden.
# Manual controls: runners: JSON array of runner labels (push/PR runs use Linux only).
# Run policy: newer runs replace obsolete validation in the same group.
# Access: workflow token permissions are {"contents": "read"}; job-level overrides below own any
# elevated access.
# Maintenance: keep full-SHA action references/tool pins coordinated with Dependabot and the
# repository configuration. See README.md in this directory for the job map and local validation.
# End workflow contract documentation.

# TODO Reviewed ??-??-2026.

## Continuous integration: runs the reusable Rust CI on Linux (push/PR) or any OS set (manual run).
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  ## Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      runners:
        description: "JSON array of runner labels (push/PR runs use Linux only)"
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job changes: Classify changed inputs and export decisions to downstream jobs.
  # Skip only the scopes named by these filters; fixtures, manifests and workflow changes must still
  # select their owning validation.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      container: ${{ steps.filter.outputs.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!README.md'
              - '!TODO.md'
              - '!AGENTS.md'
              - '!CONTRIBUTING.md'
              - '!CHANGELOG.md'
              - '!RELEASES.md'
              - '!.github/workflows/README.md'
            container:
              - '{.devcontainer/**,.dockerignore,.github/workflows/**}'
  # Job rust: Delegate validation to ./.github/workflows/rust-ci.yml.
  # The called workflow owns runner setup and checks; pass declared inputs explicitly instead of
  # duplicating its implementation here.
  # Dependency boundary: "changes"; downstream work must not consume an unchecked or missing
  # upstream result.
  # Guard: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true' }}.
  # Keep this condition when refactoring triggers or job dependencies.
  rust:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true' }}
    uses: ./.github/workflows/rust-ci.yml
    with:
      ## Linux on push/PR; manual runs can select the cross-platform matrix.
      runners: ${{ inputs.runners || '["ubuntu-latest"]' }}

  # Job documentation: Build or validate the maintained documentation and generated output.
  # Rendering catches broken configuration, includes and generated links that a source formatter
  # cannot detect.
  # Dependency boundary: "changes"; downstream work must not consume an unchecked or missing
  # upstream result.
  # Guard: needs.changes.outputs.code != 'true'. Keep this condition when refactoring triggers or
  # job dependencies.
  documentation:
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dprint/check@371a959e3c77f34a76a03d2c50df2e3f2302d016 # v2

env:
  CODE_TARGET_ROOT: ${{ github.workspace }}/.ci/target
  CODE_BUILD_ROOT: ${{ github.workspace }}/.ci/build
  CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/book_tooling/main
  CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/book_tooling/main
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/book_tooling/main
  CARGO_INCREMENTAL: '0'
