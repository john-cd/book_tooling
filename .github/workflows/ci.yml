## Continuous integration: runs the reusable Rust CI on Linux (push/PR) or any OS set (manual run).
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  ## Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      runners:
        description: "JSON array of runner labels (push/PR runs use Linux only)"
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: $/.github/workflows/rust-ci.yml
    with:
      ## Private repo: Linux only on push/PR; all OSes on manual runs.
      runners: ${{ inputs.runners || '["ubuntu-latest"]' }}
env:
  CODE_TARGET_ROOT: ${{ github.workspace }}/.ci/target
  CODE_BUILD_ROOT: ${{ github.workspace }}/.ci/build
  CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/book_tooling/main
  CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/book_tooling/main
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/book_tooling/main
  CARGO_INCREMENTAL: '0'
