## Reusable workflow: format, build, lint and test the Cargo workspace on every OS.
##
## Called by `ci.yml`. Shape and step names match `mdbook-utils/.github/workflows/rust-ci.yml`.
## See `.github/workflows/README.md` for the full picture.
name: Rust CI (reusable)

on:
  workflow_call:
    inputs:
      runners:
        description: "JSON array of GitHub runner labels to run on"
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'

permissions:
  contents: read

## Every step runs in bash (Git Bash on Windows) so that the commands below are identical on all platforms.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  ## Keep the local compiler-cache policy; CI uses runner-local output paths.
  CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/book_tooling/main
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/book_tooling/main
  RUSTC_WRAPPER: sccache
  CARGO_BUILD_RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"

  CODE_TARGET_ROOT: ${{ github.workspace }}/.ci/target
  CODE_BUILD_ROOT: ${{ github.workspace }}/.ci/build
  CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/book_tooling/main
jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
    steps:
      - name: Code checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust (1.99.1 + pinned nightly rustfmt)
        id: setup-rust
        uses: $/.github/actions/setup-rust

        with:
          cache-key: ci-profile-ci-default-features
          cache-workspaces: . -> .ci/target/book_tooling/main
      - name: Install workspace tools (cargo-nextest, prek, dprint, cargo-deny, just)
        # taiki-e/install-action v2.88.0
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32
        with:
          tool: |
            cargo-nextest@0.9.148
            prek@0.5.7
            dprint@0.64.3
            cargo-deny@0.20.2
            just@1.59.0
          fallback: none

      - name: Run repository hooks
        env:
          RUSTFMT_TOOLCHAIN: ${{ steps.setup-rust.outputs.rustfmt_toolchain }}
        run: prek run --all-files

      - name: Fetch
        run: cargo fetch --locked

      - name: Build
        run: cargo build --workspace --all-targets --locked --profile ci

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --profile ci -- --deny warnings

      - name: Run tests
        run: cargo nextest run --workspace --all-targets --locked --profile ci --cargo-profile ci --hide-progress-bar

      - name: Run doctests
        run: cargo test --workspace --doc --locked --profile ci -- --show-output

  ## Informational: reports line coverage in the job summary. Never fails the workflow; no gate yet.
  coverage:
    name: Coverage (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Code checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust (1.99.1 + llvm-tools)
        id: setup-rust
        uses: $/.github/actions/setup-rust
        with:
          components: "clippy llvm-tools-preview"
          cache-key: coverage-profile-dev-default-features

          cache-workspaces: . -> .ci/target/book_tooling/main
      - name: Install cargo-llvm-cov
        # taiki-e/install-action v2.88.0
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32
        with:
          tool: cargo-llvm-cov

      - name: Measure coverage
        run: |
          cargo llvm-cov --workspace --locked --summary-only | tee coverage-summary.txt
          {
            echo '### Line coverage (informational)'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.98.1
        with:
          toolchain: 1.98.1
      - name: Check declared minimum version
        run: cargo check --workspace --all-targets --locked
