## Reusable workflow: format, build, lint and test the Cargo workspace on every OS.
##
## Called by `ci.yml`. Shape and step names match `mdbook-utils/.github/workflows/rust-ci.yml`.
## See `.github/workflows/README.md` for the full picture.
name: Rust CI (reusable)

on:
  workflow_call:
    inputs:
      runners:
        description: "JSON array of GitHub runner labels to run on"
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'

permissions:
  contents: read

## Every step runs in bash (Git Bash on Windows) so that the commands below are identical on all platforms.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  ## Keep the local compiler-cache policy; CI uses runner-local output paths.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/target/build
  RUSTC_WRAPPER: sccache
  CARGO_BUILD_RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
    steps:
      - name: Code checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust (1.99.1 + pinned nightly rustfmt)
        uses: ./.github/actions/setup-rust

      - name: Install workspace tools (sccache, cargo-nextest, prek, dprint, cargo-deny)
        # taiki-e/install-action v2.87.30
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32
        with:
          tool: |
            sccache@0.19.0
            cargo-nextest@0.9.145
            prek@0.5.6
            dprint@0.64.1
            cargo-deny@0.20.2
          fallback: none

      - name: Run repository hooks
        run: prek run --all-files

      - name: Fetch
        run: cargo fetch --locked

      - name: Build
        run: cargo build --workspace --all-targets --locked --profile ci

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --profile ci -- --deny warnings

      - name: Run tests
        run: cargo nextest run --workspace --all-targets --locked --cargo-profile ci --hide-progress-bar

      - name: Run doctests
        run: cargo test --workspace --doc --locked --profile ci -- --show-output

  ## Informational: reports line coverage in the job summary. Never fails the workflow; no gate yet.
  coverage:
    name: Coverage (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Code checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust (1.99.1 + llvm-tools)
        uses: ./.github/actions/setup-rust
        with:
          components: "clippy llvm-tools-preview"
          cache-key: coverage

      - name: Install cargo-llvm-cov and sccache
        # taiki-e/install-action v2.87.30
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32
        with:
          tool: cargo-llvm-cov,sccache@0.19.0

      - name: Measure coverage
        run: |
          cargo llvm-cov --workspace --locked --summary-only | tee coverage-summary.txt
          {
            echo '### Line coverage (informational)'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
