# Workflow contract documentation (maintained with the implementation).
# Workflow contract: book_tooling / Rust CI (reusable).
# Purpose: Compile, lint or test the Rust source for the scope selected by the commands below;
# Measure executed-code coverage with instrumented binaries; Check the declared minimum Rust
# compiler, independently of the current development compiler.
# Execution: workflow_call. Trigger branches/paths below are the authoritative input boundary.
# Reuse: callers pass declared inputs/secrets; a called workflow cannot elevate the caller token
# permissions.
# Access: workflow token permissions are {"contents": "read"}; job-level overrides below own any
# elevated access.
# Maintenance: keep full-SHA action references/tool pins coordinated with Dependabot and the
# repository configuration. See README.md in this directory for the job map and local validation.
# End workflow contract documentation.

# TODO Reviewed ??-??-2026.

## Reusable workflow: format, build, lint and test the Cargo workspace on every OS.
##
## Called by `ci.yml`. Compare the companion mdbook-utils `.github/workflows/ci.yml`
## when changing shared compiler/cache conventions; each repository owns its own job graph.
## See `.github/workflows/README.md` for the full picture.
name: Rust CI (reusable)

on:
  workflow_call:
    inputs:
      runners:
        description: "JSON array of GitHub runner labels to run on"
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'

permissions:
  contents: read

## Every step runs in bash (Git Bash on Windows) so that the commands below are identical on all platforms.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  ## Keep the local compiler-cache policy; CI uses runner-local output paths.
  CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/book_tooling/main
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/book_tooling/main
  RUSTC_WRAPPER: sccache
  CARGO_BUILD_RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"

  CODE_TARGET_ROOT: ${{ github.workspace }}/.ci/target
  CODE_BUILD_ROOT: ${{ github.workspace }}/.ci/build
  CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/book_tooling/main
jobs:
  # Job validate: Compile, lint or test the Rust source for the scope selected by the commands
  # below.
  # Keep compiler/profile/feature selections aligned so adjacent commands reuse outputs; retain real
  # binary generation, doctests and distinct minimum-version checks.
  # Matrix entries are independent runners. Keep OS/toolchain/feature-specific tests; consolidate
  # only checks whose inputs are identical.
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
    steps:
      - name: Code checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Install the compiler/components required by this lane. Keep the stable, minimum-version and
      # formatter toolchains distinct where their contracts differ.
      - name: Set up Rust (pinned stable + pinned nightly rustfmt)
        id: setup-rust
        uses: ./.github/actions/setup-rust

        with:
          cache-key: ci-profile-ci-default-features
          cache-workspaces: . -> .ci/target/book_tooling/main
      # Install the tool versions consumed by the following checks. Prefer the existing prebuilt
      # installer path to recompiling development tools on every fresh runner.
      - name: Install workspace tools (cargo-nextest, prek, dprint, cargo-deny, just)
        # taiki-e/install-action v2.90.4
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: |
            cargo-nextest@0.9.151
            prek@0.5.9
            dprint@0.64.3
            cargo-deny@0.20.2
            just@1.59.0
          fallback: none

      - name: Run repository hooks
        if: runner.os == 'Linux'
        env:
          RUSTFMT_TOOLCHAIN: ${{ steps.setup-rust.outputs.rustfmt_toolchain }}
        run: prek run --all-files

      - name: Check configuration paths and cross-file pins
        if: runner.os == 'Linux'
        run: |
          just config-drift
          just orphansources

      - name: Validate GitHub Actions workflows
        if: runner.os == 'Linux'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

      - name: Validate devcontainer Compose configuration
        if: runner.os == 'Linux'
        run: docker compose --env-file .devcontainer/.env -f .devcontainer/compose.yaml config --quiet

      # Retain real code generation/linking for the requested build scope; a typecheck alone cannot
      # prove linked binaries/examples can be produced.
      - name: Build
        run: cargo build --workspace --all-targets --locked --profile ci

      # Clippy performs compiler checking for these targets/features as well as linting. Keep a
      # separate cargo check only when it covers a different compiler, target or feature set.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --profile ci -- --deny warnings

      # Run compiled test binaries with the configured Nextest profile. Nextest does not run Rust
      # doctests; retain the separate cargo test --doc step where present.
      - name: Run tests
        run: cargo nextest run --workspace --all-targets --locked --profile ci --cargo-profile ci --hide-progress-bar

      # Execute documentation examples separately: passing unit/integration tests or Nextest does
      # not establish doctest correctness.
      - name: Run doctests
        run: cargo test --workspace --doc --locked --profile ci -- --show-output

  ## Informational: reports line coverage in the job summary. Never fails the workflow; no gate yet.
  # Job coverage: Measure executed-code coverage with instrumented binaries.
  # Instrumentation can change build outputs; this job is separate from ordinary validation so
  # coverage does not reuse incompatible binaries.
  coverage:
    name: Coverage (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Code checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Install the compiler/components required by this lane. Keep the stable, minimum-version and
      # formatter toolchains distinct where their contracts differ.
      - name: Set up Rust (pinned stable + llvm-tools)
        id: setup-rust
        uses: ./.github/actions/setup-rust
        with:
          components: "clippy llvm-tools-preview"
          cache-key: coverage-profile-dev-default-features

          cache-workspaces: . -> .ci/target/book_tooling/main
      # Install the tool versions consumed by the following checks. Prefer the existing prebuilt
      # installer path to recompiling development tools on every fresh runner.
      - name: Install cargo-llvm-cov
        # taiki-e/install-action v2.90.4
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: cargo-llvm-cov

      - name: Measure coverage
        run: |
          cargo llvm-cov --workspace --locked --summary-only | tee coverage-summary.txt
          {
            echo '### Line coverage (informational)'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Job msrv: Check the declared minimum Rust compiler, independently of the current development
  # compiler.
  # A passing current-toolchain build does not prove the advertised minimum version still compiles.
  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Install the compiler/components required by this lane. Keep the stable, minimum-version and
      # formatter toolchains distinct where their contracts differ.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.98.1
        with:
          toolchain: 1.98.1
      - name: Check declared minimum version
        run: cargo check --workspace --all-targets --locked
