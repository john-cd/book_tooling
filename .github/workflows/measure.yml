# Workflow contract documentation (maintained with the implementation).
# Workflow contract: book_tooling / Measure.
# Purpose: Measure the selected build/runtime scenario and retain its diagnostic output.
# Execution: workflow_dispatch. Trigger branches/paths below are the authoritative input boundary.
# Manual operation: use the Actions tab or gh workflow run; input defaults below apply unless
# explicitly overridden.
# Run policy: newer runs replace obsolete validation in the same group.
# Access: workflow token permissions are {"contents": "read"}; job-level overrides below own any
# elevated access.
# Maintenance: keep full-SHA action references/tool pins coordinated with Dependabot and the
# repository configuration. See README.md in this directory for the job map and local validation.
# End workflow contract documentation.

# TODO Reviewed ??-??-2026.

## Manual measurement of cold/warm rebuild time, output sizes and release linking per OS.
## Compiler cache is disabled so timings are not distorted by shared sccache counters.
name: Measure

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize side effects; superseded validation may stop before spending more runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job measure: Measure the selected build/runtime scenario and retain its diagnostic output.
  # Compare equivalent toolchains, profiles and cache states; timing data from different
  # configurations is not a speedup measurement.
  # Matrix entries are independent runners. Keep OS/toolchain/feature-specific tests; consolidate
  # only checks whose inputs are identical.
  measure:
    name: Build profiles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Install the compiler/components required by this lane. Keep the stable, minimum-version and
      # formatter toolchains distinct where their contracts differ.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"
          nightly: skip
      # Retain real code generation/linking for the requested build scope; a typecheck alone cannot
      # prove linked binaries/examples can be produced.
      - name: Measure
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV
          sec() { date +%s; }
          run() { # label, args...
            local label=$1; shift
            local t0; t0=$(sec)
            cargo build --workspace --all-targets --locked "$@" --quiet
            local t1; t1=$(sec)
            echo "$label: $((t1 - t0)) s"
          }
          size() { du -sk "$1" 2>/dev/null | cut -f1; }
          {
            echo "### ${{ matrix.os }} build measurements"
            echo '```'
            rustc -vV | sed -n '1p;5p'
            cargo fetch --locked
            run "ci cold" --profile ci
            echo "ci target KiB: $(size "${CARGO_TARGET_DIR:-target}")"
            touch parse_lib/src/lib.rs
            run "ci warm (touch parse_lib/src/lib.rs, deps cached)" --profile ci
            run "ci no-op" --profile ci
            run "release cold (linker: ${{ matrix.os }} default)" --release
            echo "release target KiB: $(size "${CARGO_TARGET_DIR:-target}")"
            touch parse_lib/src/lib.rs
            run "release warm" --release
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
