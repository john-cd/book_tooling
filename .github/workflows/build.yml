name: Build book_tooling

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  ## Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

## ---------------------------------------------------------------------

jobs:
  build_code:
    name: Build code for book_tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Local Cargo paths point to developer-specific volumes; CI uses runner-local paths.
      CARGO_TARGET_DIR: target
      CARGO_BUILD_BUILD_DIR: target/build
    steps:
      # Checks out your repository under $GITHUB_WORKSPACE
      - name: Code checkout (clones the Git repository)
        uses: actions/checkout@v4

      # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/caching-dependencies-to-speed-up-workflows
      # Install paths for Rust / Cargo in https://github.com/actions/runner-images/blob/main/images/windows/scripts/build/Install-Rust.ps1
      - name: Cache Cargo registry and dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/binstall/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: book_tooling-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            book_tooling-${{ runner.os }}-cargo-

      - name: Install `cargo binstall`
        if: runner.os == 'Linux'
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Install Nextest
        if: runner.os == 'Linux'
        run: cargo binstall --no-confirm --secure cargo-nextest

      - name: Update Rust; install nightly Rust
        run: |
          rustup update stable
          rustup toolchain install nightly
          rustup component add rustfmt --toolchain nightly
          rustup default stable
          rustup --version
          rustup show

      - name: Check the formatting
        run: cargo +nightly fmt --all --check

      - name: Fetch
        run: cargo fetch

      - name: Build
        run: cargo build --workspace --all-targets --locked --profile ci

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --profile ci -- --deny warnings

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo nextest run --workspace --all-targets --locked --cargo-profile ci --hide-progress-bar
          cargo test --workspace --doc --locked --profile ci -- --show-output

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo test --workspace --all-targets --locked --profile ci -- --show-output
          cargo test --workspace --doc --locked --profile ci -- --show-output
